name: Deploy Lambda Function

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FUNCTION_NAME: extract-tool-api
  FUNCTION_ARN: arn:aws:lambda:us-east-2:713944518341:function:extract-tool-api
  AWS_ACCOUNT_ID: "713944518341"

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "us-east-2"

    steps:
      - uses: actions/checkout@v4

      - name: Create zip (exclude non-runtime files)
        run: zip -r code.zip . -x ".git/*" ".github/*" ".gitignore" "*.md" ".env" ".idea/*" ".vscode/*" "__pycache__/*" "*.pyc"

      - name: Deploy code to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.FUNCTION_NAME }} \
            --zip-file fileb://code.zip

      - name: Wait for function update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.FUNCTION_NAME }}

      - name: Set Lambda timeout and environment variables
        run: |
          # Get existing env vars so we don't clobber them
          EXISTING_ENV=$(aws lambda get-function-configuration \
            --function-name ${{ env.FUNCTION_NAME }} \
            --query 'Environment.Variables' \
            --output json 2>/dev/null || echo '{}')

          # Merge LAMBDA_FUNCTION_ARN into existing env vars
          MERGED_ENV=$(echo "$EXISTING_ENV" | python3 -c "
          import sys, json
          env = json.load(sys.stdin)
          env['LAMBDA_FUNCTION_ARN'] = '${{ env.FUNCTION_ARN }}'
          print(json.dumps({'Variables': env}))
          ")

          aws lambda update-function-configuration \
            --function-name ${{ env.FUNCTION_NAME }} \
            --timeout 300 \
            --environment "$MERGED_ENV"

      - name: Wait for configuration update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.FUNCTION_NAME }}

      - name: Allow Lambda to invoke itself (self-invocation policy)
        run: |
          # Remove existing policy if present (idempotent), then re-add
          aws lambda remove-permission \
            --function-name ${{ env.FUNCTION_NAME }} \
            --statement-id AllowSelfInvoke 2>/dev/null || true

          aws lambda add-permission \
            --function-name ${{ env.FUNCTION_NAME }} \
            --statement-id AllowSelfInvoke \
            --action lambda:InvokeFunction \
            --principal lambda.amazonaws.com \
            --source-arn ${{ env.FUNCTION_ARN }}