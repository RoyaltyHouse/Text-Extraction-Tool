name: Deploy Lambda Function

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Install zip tool
        uses: montudor/action-zip@v1

      - name: Create Zip file for Lambda function
        run: zip -r code.zip .

      - name: Deploy Lambda code
        uses: imehedi/actions-awscli-v2@latest
        with:
          args: "lambda update-function-code \
            --function-name arn:aws:lambda:us-east-2:713944518341:function:extract-tool-api \
            --zip-file fileb://code.zip"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "us-east-2"

      - name: Set Lambda timeout to 5 minutes
        uses: imehedi/actions-awscli-v2@latest
        with:
          args: "lambda update-function-configuration \
            --function-name arn:aws:lambda:us-east-2:713944518341:function:extract-tool-api \
            --timeout 300"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "us-east-2"

      - name: Remove existing self-invocation permission (idempotent)
        uses: imehedi/actions-awscli-v2@latest
        with:
          args: "lambda remove-permission \
            --function-name arn:aws:lambda:us-east-2:713944518341:function:extract-tool-api \
            --statement-id AllowSelfInvoke"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "us-east-2"
        continue-on-error: true

      - name: Add self-invocation permission
        uses: imehedi/actions-awscli-v2@latest
        with:
          args: "lambda add-permission \
            --function-name arn:aws:lambda:us-east-2:713944518341:function:extract-tool-api \
            --statement-id AllowSelfInvoke \
            --action lambda:InvokeFunction \
            --principal arn:aws:iam::713944518341:root"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "us-east-2"
